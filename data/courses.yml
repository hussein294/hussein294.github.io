# Course details, in English (en) and Arabic (ar).
#
# To update dates and prices, edit `next_cohort` and `price` under each course.
# Leave a value empty ("") and the page shows "To be announced" with a link to ADA.
# Write the values as you want them shown, for example:
#   next_cohort: { en: "1 February 2027", ar: "1 فبراير 2027" }
#   price:       { en: "EGP 0,000", ar: "0,000 جنيه" }

courses:
  # ---------------------------------------------------------------------------
  - id: ai-systems-engineering
    next_cohort: { en: "", ar: "" }
    price: { en: "", ar: "" }

    en:
      name: Practical AI Systems Engineering Diploma
      tagline: Build, deploy and monitor AI systems that run in production.
      lead: >-
        This is not another AI course. It trains the AI engineer the market actually
        needs: someone who builds, deploys and monitors AI systems running in
        production, not someone who only knows how to send a request to an API.
      status: The first cohort started on 15 September 2026.
      facts:
        - { label: Duration, value: 14 weeks }
        - { label: Sessions, value: "42" }
        - { label: Format, value: Online }
        - { label: Cohort size, value: 10 to 15 students }
        - { label: Labs, value: 15+ }
        - { label: Starting point, value: "Python, from zero" }
      sections:
        - heading: Who it is for
          text: >-
            Students and early-career engineers who want to work as AI engineers.
            The diploma starts from Python and assumes no prior programming background.
        - heading: What you will learn
          items:
            - Python, from the beginning
            - How large language models work and how to use them well
            - Structured outputs and tool calling
            - Retrieval-augmented generation (RAG)
            - The Model Context Protocol (MCP)
            - Agentic workflows
            - Guardrails
            - Docker
            - Observability
        - heading: The capstone
          text: >-
            You finish by building one complete system: an agent with MCP servers,
            RAG on Qdrant and a locally hosted model. It is assembled with Docker
            Compose, monitored with LangSmith and protected by guardrails.
        - heading: A weekly research seminar
          text: >-
            Every week, students read, present and discuss research papers. The field
            keeps changing, so the diploma teaches you how to keep up with it, not
            only how to use today's tools.
        - heading: How it was designed
          text: >-
            I built the curriculum from job-market requirements and from the skills
            I have seen production AI engineering actually demand. I designed it end
            to end and I teach it myself.
      faq:
        - q: Do I need programming experience?
          a: No. The diploma starts from Python with no prior programming background.
        - q: Is it online?
          a: Yes. All 42 sessions are online, in small cohorts of 10 to 15 students.
        - q: How do I register and pay?
          a: >-
            Through ADA Egypt. ADA handles enrolment and payment for the diploma.
            This website does not take payments.
        - q: When is the next cohort, and what does it cost?
          a: ADA announces cohort dates and fees. Use the registration link to ask them.

    ar:
      name: دبلومة هندسة أنظمة الذكاء الاصطناعي التطبيقية
      tagline: ابنِ أنظمة ذكاء اصطناعي تعمل فعلًا في بيئة الإنتاج، وانشرها وراقبها.
      lead: >-
        مش «كورس AI كمان». هذه الدبلومة تُعِدّ مهندس الذكاء الاصطناعي الذي يحتاجه
        السوق فعلًا: من يبني أنظمة الذكاء الاصطناعي وينشرها ويراقبها وهي تعمل في
        بيئة الإنتاج، لا من يعرف فقط كيف يرسل طلبًا إلى API.
      status: بدأت الدفعة الأولى يوم 15 سبتمبر 2026.
      facts:
        - { label: المدة, value: 14 أسبوعًا }
        - { label: عدد المحاضرات, value: "42" }
        - { label: طريقة الدراسة, value: أونلاين }
        - { label: حجم الدفعة, value: من 10 إلى 15 طالبًا }
        - { label: المعامل العملية, value: أكثر من 15 }
        - { label: نقطة البداية, value: بايثون من الصفر }
      sections:
        - heading: لمن هذه الدبلومة؟
          text: >-
            للطلاب والمهندسين في بداية مسيرتهم ممن يريدون العمل كمهندسي ذكاء اصطناعي.
            نبدأ من بايثون، ولا نفترض أي خبرة سابقة في البرمجة.
        - heading: ماذا ستتعلم؟
          items:
            - بايثون من البداية
            - كيف تعمل نماذج اللغة الكبيرة (LLMs) وكيف تستخدمها جيدًا
            - المخرجات المنظَّمة (Structured outputs) واستدعاء الأدوات (Tool calling)
            - التوليد المعزَّز بالاسترجاع (RAG)
            - بروتوكول MCP
            - سير العمل المعتمد على الوكلاء (Agentic workflows)
            - ضوابط الحماية (Guardrails)
            - Docker
            - المراقبة والتتبّع (Observability)
        - heading: مشروع التخرج
          text: >-
            تُنهي الدبلومة ببناء نظام كامل: وكيل (Agent) يعمل مع خوادم MCP، ومعه RAG
            على Qdrant ونموذج مُستضاف محليًا. يُجمَّع النظام كله بـ Docker Compose،
            ويُراقَب بـ LangSmith، وتحميه Guardrails.
        - heading: سيمنار بحثي كل أسبوع
          text: >-
            كل أسبوع يقرأ الطلاب أوراقًا بحثية ويعرضونها ويناقشونها. المجال يتغيّر
            باستمرار، فالهدف أن تتعلم كيف تواكبه، لا أن تتعلم أدوات اليوم فقط.
        - heading: كيف صُمِّمت؟
          text: >-
            بنيتُ المنهج على متطلبات سوق العمل وعلى المهارات التي رأيتُ أن هندسة
            الذكاء الاصطناعي في بيئة الإنتاج تحتاجها فعلًا. صمّمتُ المنهج كاملًا
            وأدرّسه بنفسي.
      faq:
        - q: هل أحتاج إلى خبرة سابقة في البرمجة؟
          a: لا. الدبلومة تبدأ من بايثون ولا تفترض أي خلفية برمجية.
        - q: هل الدراسة أونلاين؟
          a: نعم. المحاضرات الـ42 كلها أونلاين، في دفعات صغيرة من 10 إلى 15 طالبًا.
        - q: كيف أسجّل وأدفع؟
          a: >-
            عن طريق ADA Egypt. التسجيل والدفع يتمّان من خلال الأكاديمية، وهذا الموقع
            لا يستقبل أي مدفوعات.
        - q: متى تبدأ الدفعة القادمة وما التكلفة؟
          a: تعلن ADA مواعيد الدفعات والرسوم. استخدم رابط التسجيل للاستفسار منهم.

