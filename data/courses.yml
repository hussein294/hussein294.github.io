  - id: machine-learning
    next_cohort: { en: "", ar: "" }
    price: { en: "", ar: "" }

    en:
      name: Machine Learning Diploma
      tagline: Take a model from messy data to production, not just to model.fit().
      lead: >-
        There is a big difference between someone who knows machine learning and
        someone who does it. Doing it means sitting in front of messy data, with
        missing values and meaningless columns and nobody telling you what to do,
        and working until a model actually works.
      status: No cohort has started yet. Ask ADA about the first intake.
      facts:
        - { label: Duration, value: 16 weeks }
        - { label: Modules, value: "18" }
        - { label: Sessions, value: "48" }
        - { label: Workshops, value: "16, one every week" }
        - { label: Projects, value: 6 real-world projects }
        - { label: Capstone, value: Deployed }
      sections:
        - heading: How each week works
          text: >-
            Every week has two content sessions and one hands-on workshop. That is
            16 weeks and 16 workshops.
        - heading: The workshops
          text: "Each workshop is a real problem of the kind nobody trains you for:"
          items:
            - Data that silently breaks the model
            - A model with 95% accuracy and no practical value
            - A feature that matters more than any algorithm
            - Data leakage that looks great in training and fails in production
            - A model that works on your laptop and falls over on its first deployment
        - heading: The full path
          text: >-
            The diploma goes from exploratory data analysis and feature engineering,
            through tree-based models and deep learning, to MLflow, FastAPI, Docker
            and monitoring. The model really reaches production.
        - heading: What you leave with
          text: >-
            A portfolio you built yourself: six real-world projects and a deployed
            capstone.
        - heading: How it was designed
          text: >-
            I designed this diploma the way I believe machine learning should be
            taught, and I teach it myself.
      faq:
        - q: How is this different from other machine learning courses?
          a: >-
            It is built around practice. A third of the sessions are workshops on
            real problems, and the path does not stop at training a model. It
            continues through deployment and monitoring.
        - q: How do I register and pay?
          a: >-
            Through ADA Egypt. ADA handles enrolment and payment for the diploma.
            This website does not take payments.
        - q: When does it start, and what does it cost?
          a: ADA announces cohort dates and fees. Use the registration link to ask them.

    ar:
      name: دبلومة تعلّم الآلة
      tagline: من بيانات فوضوية إلى موديل شغّال في الإنتاج، مش لحد model.fit وبس.
      lead: >-
        الفرق كبير بين من «يعرف» تعلّم الآلة ومن «يمارسه». الممارسة أن تجلس أمام
        بيانات فوضوية، فيها قيم ناقصة وأعمدة بلا معنى، ولا أحد يخبرك ماذا تفعل،
        وتظل تعمل حتى يعمل النموذج فعلًا.
      status: لم تبدأ أي دفعة بعد. اسأل ADA عن موعد الدفعة الأولى.
      facts:
        - { label: المدة, value: 16 أسبوعًا }
        - { label: الوحدات, value: "18" }
        - { label: عدد المحاضرات, value: "48" }
        - { label: الورش العملية, value: 16 ورشة، واحدة كل أسبوع }
        - { label: المشاريع, value: 6 مشاريع واقعية }
        - { label: مشروع التخرج, value: منشور فعليًا (Deployed) }
      sections:
        - heading: كيف يسير كل أسبوع؟
          text: >-
            في كل أسبوع محاضرتان للمحتوى وورشة عملية واحدة. أي 16 أسبوعًا و16 ورشة.
        - heading: الورش العملية
          text: "كل ورشة مشكلة حقيقية من النوع الذي لا يدرّبك عليه أحد:"
          items:
            - بيانات تُفسد النموذج في صمت
            - نموذج دقته 95% ولا قيمة عملية له
            - خاصية (Feature) واحدة أهم من أي خوارزمية
            - تسريب بيانات (Data leakage) يبدو رائعًا في التدريب ويفشل في الإنتاج
            - نموذج يعمل على جهازك ويسقط مع أول نشر
        - heading: المسار كاملًا
          text: >-
            من تحليل البيانات الاستكشافي (EDA) وهندسة الخصائص، مرورًا بنماذج الأشجار
            والتعلّم العميق، حتى MLflow وFastAPI وDocker والمراقبة. النموذج يصل فعلًا
            إلى الإنتاج.
        - heading: بماذا تخرج؟
          text: >-
            بمعرض أعمال بنيته بنفسك: ستة مشاريع واقعية ومشروع تخرج منشور فعليًا.
        - heading: كيف صُمِّمت؟
          text: >-
            صمّمتُ هذه الدبلومة بالطريقة التي أرى أن تعلّم الآلة يجب أن يُدرَّس بها،
            وأدرّسها بنفسي.
      faq:
        - q: ما الذي يميّزها عن غيرها من كورسات تعلّم الآلة؟
          a: >-
            أنها مبنية على الممارسة. ثلث المحاضرات ورش على مشاكل حقيقية، والمسار لا
            يتوقف عند تدريب النموذج، بل يكمل حتى النشر والمراقبة.
        - q: كيف أسجّل وأدفع؟
          a: >-
            عن طريق ADA Egypt. التسجيل والدفع يتمّان من خلال الأكاديمية، وهذا الموقع
            لا يستقبل أي مدفوعات.
        - q: متى تبدأ وما التكلفة؟
          a: تعلن ADA مواعيد الدفعات والرسوم. استخدم رابط التسجيل للاستفسار منهم.

